[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiprouting"
version = "0.0.1"
description = "Weather-aware ship route and speed optimisation for minimum fuel"
requires-python = ">=3.11"
dependencies = ["numpy", "shapely"]

[project.optional-dependencies]
dev = ["pytest"]
weather = ["eccodes", "ecmwf-opendata"]
sea = ["pyogrio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
